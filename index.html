<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crisis Updates · SMUN UEFA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --black:#000;
  --panel:#0c0907;
  --gold:#d9ae4f;
  --gold-soft:#a98433;
  --red:#d3241b;
  --red-deep:#7c120d;
  --green:#7c9a2c;
  --cream:#efe3c4;
  --muted:#b9a883;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--black);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;line-height:1.65}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(211,36,27,.22),transparent 70%)}
main{max-width:640px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1,h2,.btn-title{font-family:'Cinzel',Georgia,serif}
.crest{display:block;margin:0 auto 1rem;width:92px;height:92px}
h1{text-align:center;font-size:clamp(1.9rem,7vw,2.8rem);font-weight:700;letter-spacing:.08em;margin:0;color:var(--gold)}
.sub{text-align:center;color:var(--muted);margin:.4rem 0 0;font-size:1.1rem}
.rule{height:1px;margin:1.8rem auto;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent)}
.list{display:flex;flex-direction:column;gap:.9rem}
.btn{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;padding:1.1rem 1.3rem;background:var(--panel);color:var(--cream);border:1px solid var(--gold-soft);border-left:5px solid var(--red);border-radius:6px;cursor:pointer;text-align:left;font:inherit;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:#1a110c;border-color:var(--gold);transform:translateX(4px)}
.btn:focus-visible,.back:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn-title{font-weight:700;font-size:1.05rem;letter-spacing:.05em;color:var(--gold)}
.btn-date{color:var(--muted);font-size:1.05rem;white-space:nowrap}
.back{display:inline-block;margin-bottom:1.4rem;padding:.55rem 1.1rem;background:transparent;color:var(--gold);border:1px solid var(--gold-soft);border-radius:999px;cursor:pointer;font-family:'Cinzel',Georgia,serif;font-size:.85rem;letter-spacing:.08em}
.back:hover{background:var(--gold);color:#000}
.photo {
    width: 100%;
    border-radius: 6px;
    border: 1px solid var(--gold-soft);
    overflow: hidden;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
}

.photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
}
.ph{color:var(--muted);text-align:center;font-size:1rem}
.ph svg{width:56px;height:56px;display:block;margin:0 auto .4rem}
h2{font-size:clamp(1.4rem,5vw,1.9rem);color:var(--gold);margin:1.5rem 0 .2rem;letter-spacing:.04em}
.date{color:var(--red);font-weight:600;margin:0 0 1rem}
.body p{margin:0 0 1rem}
footer{text-align:center;color:var(--gold-soft);font-size:.95rem;margin-top:3rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="home">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#a98433" stroke-width="2"/>
      <circle cx="50" cy="50" r="27" fill="#d3241b"/>
      <g fill="#000"><rect x="43" y="34" width="3" height="30"/><rect x="48.5" y="30" width="3" height="34"/><rect x="54" y="34" width="3" height="30"/></g>
    </svg>
    <h1>Crisis Updates</h1>
    <p class="sub">SMUN UEFA 2026</p>
    <div class="rule"></div>
    <div class="list" id="list"></div>
    <footer>SMUN 2026</footer>
  </section>

  <section id="detail" hidden>
    <button class="back" id="back">&larr; Back</button>
    <div class="photo" id="photo"></div>
    <h2 id="d-title"></h2>
    <p class="date" id="d-date"></p>
    <div class="body" id="d-body"></div>
  </section>
</main>

<script>
/* ---- EDIT HERE: one entry per crisis update. Add a photo by setting image to a data: URI. ---- */
const UPDATES = [
  { id:"u1", title:"Crisis Update 1", date:"20 Oct 2026", image:"Arsenal.png",
    text:["The Executive Board received a bulletin report earlier this morning. This is an incredibly important development for the dynamics of our conference. This is also a reminder that events do not wait for the first session, and that this committee does not wait for the resolution of religious festivals. We suggest you read it carefully and ponder about your stance."] },
  { id:"u2", title:"Crisis Update 2", date:"21 Oct 2026", image:"Italy.png",
    text:["Earlier this morning, the Executive Board received an unmarked package with only an image (a scan of which has been shared) with the words, and we quote, ‘Beware of Who You Trust’. It is rather over dramatised, but we expect you to take this seriously. The picture portrays Giuseppe Marotta (left) and Claudio Lotito (right), with the timestamp as 20 October, 21:00 hours. The nature and origin of this image is unknown, but the timing is incredible — why would the owners of SS Lazio and Inter Milan meet on the day that Arsenal’s owners declared bankruptcy?"] },
    {
  id: "u3",
  title: "Crisis Update 3",
  date: "24 Oct 2026",
  video: "CrisisUpdate3.mp4",
  text: [
    "The UEFA press office has received a recording of a closed-door bidding session for control of Arsenal Football Club from Stan Kroenke of KSE himself. Three parties are in the room: Sheikh Mohammed bin Rashid Al Maktoum, Sergey Galitsky, and a representative of Blackstone. Stan Kroenke is present throughout. The final figure and the winning bidder are on the tape."
  ]
},
  {
  id: "u4",
  title: "Crisis Update 4",
  date: "25 Oct 2026",
  image: "Bayern Munich.jpeg",
  text: [
    "The Executive Board has received communication from the head of Fußball-Club Bayern München e.V.’s Südkurve (Bayern's Ultras). It says: “Herbert, du hast unseren wunderschönen Verein, den Stolz Bayerns, in eine Goldgrube für deutsche Konzerne verwandelt. Wir wissen, dass du die 50+1-Regelung schon immer abschaffen wolltest. Wir wissen, dass du mit Inter Mailand, Liverpool und vielleicht sogar mit Arsenal und Manchester City zusammenarbeitest. Wärst du nicht an die 50+1-Regelung gebunden, wüssten wir, dass du uns im Stich lassen, die Ticketpreise in die Höhe treiben und Bayerns Seele an die Araber verkaufen würdest. Als Eigentümer des FC Bayern geben wir dir unmissverständlich klar: Du hast 24 Stunden Zeit, jegliche Zusammenarbeit mit Vereinen, die nicht in Fanbesitz sind, zu beenden und dich als Vorreiter für fanbasierte Vereine zu engagieren. Andernfalls berufen wir eine Versammlung ein und schließen dich aus. Vergiss das Ultimatum nicht. Vergiss nicht: Nichts kann zwischen die Fans und den Verein kommen, schon gar nicht ein Kapitalist wie du.” Translation: “Herbert, you have turned our beautiful club, the pride of Bavaria, into a cash cow for German Corporations to exploit. We know that you have always wanted the 50+1 to go. We know you're working with Inter, Liverpool, and who knows maybe even Arsenal and City. If you weren't under the 50+1, we know you would ditch us, make tickets expensive and sell Bayern's soul to the Arabs. As the owners of FCB, let us make it clear, we are giving you 24 hours to stop any collaboration with non fan-owned clubs, and work as a pioneer for fan-owned clubs. If not, we willl call a meeting and expel you. Remember the ultimatum. Remember that nothing can come between the fans and the club, especially not a capitalist like you.” "
  ]
},
  {
  id: "u5",
  title: "Crisis Update 5",
  date: "25 Oct 2026",
  pdf: "BayernOfficialStatement.pdf",
  text: [
    "Bayern Munich's official statement released in response to Crisis Update 4"
  ]
},
  {
  id: "u6",
  title: "Crisis Update 6",
  date: "26 Oct 2026",
  pdf: "Inter.pdf",
  text: [
    "Inter Milan's official statement released in response to Crisis Update 2"
  ]
},
  {
  id: "u7",
  title: "Crisis Update 7",
  date: "26 Oct 2026",
  pdf: "Lazio.pdf",
  text: [
    "SS Lazio's official statement released in response to Crisis Update 2"
  ]
},
  {
  id: "u8",
  title: "Crisis Update 8",
  date: "26 Oct 2026",
  video: "CRISIS.mov",
  text: [
    "Earlier today, seemingly upon getting news of Lazio’s and Inter’s Official Statements full of ‘coincidents’ we received an email from what the UEFA tech team says is an entity based in France. The email says, and I quote: “Recording excerpt between Giuseppe Marotta and Claudio Lotito from 20 Oct 2026.” The UEFA tech team HAS confirmed that these voices are authentic by comparing them to known data of the involved parties. The video, in big text, says ‘Méfie-toi de ceux à qui tu fais confiance...‘ which translates roughly to ‘Beware of who you trust’ from French. Furthermore, UEFA has also conducted a translation of the content spoken and it is extremely worrying...Roughly, it translates to: Giuseppe Marotta: …held up as long as everyone keeps focused on transfers. Nobody will ask what else was discussed. Claudio Lotito: My friends in the Senate have settled terms with our friends in the east. They will hold their side. Giuseppe Marotta: And what about these men around us? Claudio Lotito: They are not here for us…when the cabinet sits, they will make sure…"
  ]
},
  {
  id: "u9",
  title: "Crisis Update 9",
  date: "27 Oct 2026",
  video: "BarcaStatement.pdf",
  text: [
    "Official Statement from FC Barcelona in solidarity with Bayern Munich"
},
  {
  id: "u10",
  title: "Crisis Update 10",
  date: "27 Oct 2026",
  video: "ArsenalStatement.pdf",
  text: [
    "Official Statement from Arsenal FC on their new ownership"
},
  {
  id: "u11",
  title: "Crisis Update 11",
  date: "27 Oct 2026",
  video: "ChelseaStatement.docx.pdf",
  text: [
    "Official Statement from Chelsea FC on a meeting with Tottenham Hotspur"
},
  {
  id: "u12",
  title: "Crisis Update 12",
  date: "27 Oct 2026",
  video: "NapoliStatement.pdf",
  text: [
    "Official Statement from SSC Napoli on Arsenal FC's new ownership and their worries on sponsorship money"
},
];
/* ------------------------------------------------------------------------------------------- */

const home=document.getElementById('home'), detail=document.getElementById('detail');
const list=document.getElementById('list');

UPDATES.forEach(u=>{
  const b=document.createElement('button');
  b.className='btn';
  const t=document.createElement('span'); t.className='btn-title'; t.textContent=u.title;
  const d=document.createElement('span'); d.className='btn-date'; d.textContent=u.date;
  b.append(t,d);
  b.addEventListener('click',()=>{ location.hash=u.id; });
  list.appendChild(b);
});


function show() {
  const id = location.hash.replace('#', '');
  const u = UPDATES.find(x => x.id === id);

  if (!u) {
    detail.hidden = true;
    home.hidden = false;
    window.scrollTo(0, 0);
    return;
  }

  const ph = document.getElementById('photo');
  ph.textContent = '';

  if (u.pdf) {
  const iframe = document.createElement('iframe');
  iframe.src = u.pdf;
  iframe.title = u.title + ' PDF';
  iframe.style.display = 'block';
  iframe.style.width = '100%';
  iframe.style.height = '75vh';
  iframe.style.border = '0';
  iframe.style.background = '#fff';

  ph.appendChild(iframe);

} else if (u.video) {
  const video = document.createElement('video');
  video.src = u.video;
  video.controls = true;
  video.playsInline = true;
  video.preload = 'metadata';
  video.style.display = 'block';
  video.style.width = '100%';
  video.style.maxHeight = '75vh';
  video.style.objectFit = 'contain';

  ph.appendChild(video);

} else if (u.image) {
  const img = document.createElement('img');
  img.src = u.image;
  img.alt = u.title + ' photo';
  ph.appendChild(img);

} else {
  ph.innerHTML = `
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="#a98433" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="9" cy="11" r="2"/>
        <path d="M21 17l-5-5-9 7"/>
      </svg>
      Photo goes here
    </div>`;
}
  document.getElementById('d-title').textContent = u.title;
  document.getElementById('d-date').textContent = u.date;

  const body = document.getElementById('d-body');
  body.textContent = '';

  u.text.forEach(p => {
    const el = document.createElement('p');
    el.textContent = p;
    body.appendChild(el);
  });

  home.hidden = true;
  detail.hidden = false;
  window.scrollTo(0, 0);
}

document.getElementById('back').addEventListener('click', () => {
  location.hash = '';
  show();
});

window.addEventListener('hashchange', show);
show();

document.getElementById('back').addEventListener('click',()=>{ location.hash=''; show(); });
window.addEventListener('hashchange',show);
show();
</script>
</body>
</html>
